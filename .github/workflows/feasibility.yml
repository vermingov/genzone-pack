name: yt-dlp feasibility
on: workflow_dispatch
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        client: [default, "tv", "web_safari", "web", "web_embedded", "tv_simply", "default,tv"]
        attempt: [1, 2]
    steps:
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: |
          python3 -m pip install -q -U "yt-dlp[default]"
          yt-dlp --version; deno --version | head -1
      - name: download
        run: |
          for URL in "https://www.youtube.com/watch?v=aqz-KE-bpKQ" "https://www.youtube.com/watch?v=YE7VzlLtp-4"; do
            ARGS=()
            if [ "${{ matrix.client }}" != "default" ]; then ARGS+=(--extractor-args "youtube:player_client=${{ matrix.client }}"); fi
            yt-dlp "${ARGS[@]}" -f "bestaudio/best" --no-playlist --print "OK %(title)s | %(duration)s | %(format_id)s %(acodec)s" --no-simulate \
              --max-filesize 40M -o "out-%(id)s.%(ext)s" "$URL" || echo "FAILED $URL"
          done
          ls -la out-* || true
